name: Aggregator Collect (6h)

# Prepared for Fu: run every 6 hours, plus manual trigger.
# Failure-retention: subscribe/collect.py only pushes to Gist AFTER it has
# fetched nodes, passed the alive check, and converted all formats
# successfully. If any step yields zero usable nodes it exits BEFORE the
# Gist push, so the previous Gist content (last good subscriptions) stays
# untouched.
on:
  schedule:
    # Every 6 hours (UTC). Beijing time: 02:00 / 08:00 / 14:00 / 20:00
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-aggregator
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # GitHub token with `gist` scope only (classic PAT), stored as a Secret
  GIST_PAT: ${{ secrets.GIST_PAT }}
  # Format: your-github-username/your-gist-id, stored as a Secret
  GIST_LINK: ${{ secrets.GIST_LINK }}
  # Optional: URL of your own airport/domain list. Leave unset to use the
  # project's built-in public free sources only.
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  # Include VLESS / Hysteria2 / Hysteria etc. Empty = enabled upstream.
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: secret 'GIST_PAT' cannot be empty"
              exit 1
          fi
          if [ -z "$GIST_LINK" ]; then
              echo "Error: secret 'GIST_LINK' cannot be empty"
              exit 1
          fi
          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: secret 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Collect (fetch, dedupe, alive-check, convert, push to Gist)
        # NOTE: upstream passes --skip (which SKIPS the alive check).
        # Intentionally removed here so nodes are actually checked for
        # availability. Targets default in code and are pinned explicitly:
        # clash -> clash.yaml, v2ray -> v2ray.txt, singbox -> singbox.json
        run: python -u subscribe/collect.py --all --overwrite -t clash v2ray singbox

      - name: Build V2Ray subscription (fallback)
        # subconverter cannot export some protocols (e.g. hysteria2) to
        # the v2ray target; when the whole alive pool is such a protocol
        # v2ray.txt comes out empty and is skipped. This rebuilds it from
        # the clash.yaml just pushed to the Gist. If nothing is mappable
        # it leaves the previous v2ray.txt untouched.
        if: success()
        run: python -u .github/scripts/build_v2ray.py

      - name: Timestamp
        if: always()
        run: date
